<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2563eb"><title>WASURENAI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f7fc;color:#17243b}header{background:#2563eb;color:white;padding:24px 18px 20px}header h1{margin:0;font-size:26px;letter-spacing:2px}header p{margin:5px 0 0;font-size:13px;opacity:.9}main{max-width:650px;margin:auto;padding:18px 16px 100px}.panel{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 20px #19335c10;margin-bottom:16px}h2{font-size:20px;margin:0 0 14px}.muted{color:#64748b;font-size:14px}.item{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item strong{display:block}.item small{display:block;color:#64748b;margin-top:5px;white-space:pre-wrap}button{cursor:pointer;font:inherit;border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:white;font-weight:650}button.secondary{background:#e9efff;color:#1d4ed8}button.danger{background:#fee2e2;color:#b91c1c;padding:8px 10px}input,textarea{font:inherit;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 15px;background:white}label{font-size:14px;font-weight:650}textarea{resize:vertical;min-height:85px}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 6px max(10px,env(safe-area-inset-bottom))}.tabs button{flex:1;margin:0 4px;background:transparent;color:#64748b;padding:10px 3px;font-size:14px}.tabs button.active{background:#e9efff;color:#1d4ed8}.hidden{display:none}.count{font-size:35px;font-weight:800;color:#2563eb;margin:8px 0}.empty{padding:16px;color:#64748b;text-align:center;background:#f8fafc;border-radius:10px}
</style></head><body><header><h1>WASURENAI</h1><p>忘れ物を、忘れない。</p></header><main>
<section id="home" class="page"><div class="panel"><h2>ホーム</h2><p class="muted">登録した忘れ物メモ</p><div class="count" id="count">0件</div><button onclick="showPage('add')">＋ 新しく登録</button></div><div class="panel"><h2>登録一覧</h2><div id="homeList"></div></div></section>
<section id="add" class="page hidden"><div class="panel"><h2>忘れ物を登録</h2><form id="entryForm"><label for="itemName">名前 *</label><input id="itemName" required maxlength="100" placeholder="例：水筒、宿題、鍵"><label for="itemNote">メモ</label><textarea id="itemNote" maxlength="1000" placeholder="例：明日学校に持っていく"></textarea><button type="submit">登録する</button></form></div></section>
<section id="search" class="page hidden"><div class="panel"><h2>検索</h2><input id="searchInput" placeholder="名前やメモで検索" aria-label="検索キーワード"><div id="searchList"></div></div></section>
</main><nav class="tabs" aria-label="メニュー"><button data-page="home" class="active" onclick="showPage('home')">⌂ ホーム</button><button data-page="add" onclick="showPage('add')">＋ 登録</button><button data-page="search" onclick="showPage('search')">⌕ 検索</button></nav><script>
const KEY='wasurenai_items_v1';let items=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(saved)?saved:[]}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('保存できませんでした。ブラウザの保存設定を確認してください。');return false}}
function showPage(name){document.querySelectorAll('.page').forEach(el=>el.classList.toggle('hidden',el.id!==name));document.querySelectorAll('.tabs button').forEach(el=>el.classList.toggle('active',el.dataset.page===name));render()}
function renderList(target,list){const root=document.getElementById(target);root.replaceChildren();if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='まだ登録がありません';root.append(empty);return}list.forEach(item=>{const row=document.createElement('div');row.className='item';const content=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const note=document.createElement('small');note.textContent=item.note||'メモなし';content.append(name,note);const del=document.createElement('button');del.className='danger';del.textContent='削除';del.addEventListener('click',()=>{if(confirm('この登録を削除しますか？')){items=items.filter(x=>x.id!==item.id);save();render()}});row.append(content,del);root.append(row)})}
function render(){document.getElementById('count').textContent=items.length+'件';renderList('homeList',items);const q=document.getElementById('searchInput').value.trim().toLowerCase();renderList('searchList',items.filter(x=>(x.name+' '+x.note).toLowerCase().includes(q)))}
document.getElementById('searchInput').addEventListener('input',render);document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('itemName').value.trim(),note=document.getElementById('itemNote').value.trim();if(!name)return;items.unshift({id:Date.now()+'-'+Math.random(),name,note});if(save()){e.target.reset();showPage('home')}});render();
</script></body></html>
